<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CASQUINHA · Ranking de Clubes</title>
  <meta name="description" content="Ranking de Clubes de tênis de mesa: Força do Clube, comparação e simulador de confrontos, com dados públicos da CBTM.">
  <meta name="theme-color" content="#0f2a47">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="#/" aria-label="CASQUINHA, início">
        <img src="assets/icone.svg" alt="" width="28" height="28">
        <span><b>CASQUINHA</b></span>
      </a>
      <nav class="menu" aria-label="Seções">
        <a href="#/clubes" data-secao="clubes">Ranking de Clubes</a>
        <a href="#/comparar" data-secao="comparar">Comparar</a>
        <a href="#/simulador" data-secao="simulador">Simulador</a>
        <a href="#/metodologia" data-secao="metodologia">Metodologia</a>
      </nav>
      <button class="tema" id="tema" type="button" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <main id="conteudo" tabindex="-1">
    <div class="carregando">Carregando dados…</div>
  </main>

  <footer class="rodape">
    <div class="rodape-in">
      <p><b>Fonte:</b> dados públicos da CBTM (rankings, rating e clubes federados). Projeto independente, sem vínculo oficial com a CBTM. Em caso de diferença, vale o dado oficial.</p>
      <p id="atualizacao" class="mut"></p>
    </div>
  </footer>
  <div id="dica" class="dica" role="tooltip" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
